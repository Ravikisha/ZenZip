# Release pipeline (P6.5/P6.6, P7.18/P7.19): build napi prebuilds for the full
# platform matrix — incl. musl (Alpine/Docker) — generate an SBOM, and publish
# to npm with build provenance (SLSA-aligned). Trigger: pushing a v* tag.
#
# Needs: NPM_TOKEN secret. Provenance needs `id-token: write` + npm/pnpm running
# under GitHub OIDC (automatic on GitHub-hosted runners). First run will need
# babysitting — prebuild publishing always does.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # OIDC for npm provenance (SLSA build attestation)

jobs:
  build:
    name: Prebuild (${{ matrix.settings.target }})
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # musl — cross-compiled with zig so libsqlite3-sys (embedded C) can
          # find a compiler. CC_* env vars wire cc-rs to zig cc.
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
            cc: "zig cc -target x86_64-linux-musl"
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
            cc: "zig cc -target aarch64-linux-musl"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}
      - name: Install zig (musl cross-compile)
        if: ${{ matrix.settings.cross }}
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build native module
        run: >-
          pnpm --filter @zenzip/core-native exec napi build --platform --release
          --target ${{ matrix.settings.target }}
          ${{ matrix.settings.cross && '--use-napi-cross' || '' }}
        env:
          CC_x86_64_unknown_linux_musl: ${{ matrix.settings.cc || '' }}
          CC_aarch64_unknown_linux_musl: ${{ matrix.settings.cc || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: binding-${{ matrix.settings.target }}
          path: packages/core-native/*.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: Zenzip
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create platform packages from prebuilds
        run: pnpm --filter @zenzip/core-native exec napi artifacts --dir ../../artifacts
      - name: Build TypeScript package
        run: pnpm --filter zenzip build
      # Software Bill of Materials (P7.18): CycloneDX SBOM attached to the release.
      - name: Generate SBOM (CycloneDX)
        run: npx -y @cyclonedx/cyclonedx-npm --output-file sbom.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: warn
      # `--provenance` publishes a signed SLSA build-provenance attestation to
      # the npm registry (visible on the package page). Requires id-token: write.
      - name: Publish @zenzip/core-native (with platform packages)
        run: pnpm --filter @zenzip/core-native exec napi prepublish -t npm --skip-gh-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - name: Publish zenzip
        run: pnpm --filter zenzip publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish create-zenzip-app
        run: pnpm --filter create-zenzip-app publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
