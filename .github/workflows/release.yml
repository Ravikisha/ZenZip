# Release pipeline: build napi prebuilds for the full platform matrix — incl.
# musl (Alpine/Docker) — generate an SBOM, and publish to npm with build
# provenance (SLSA-aligned). Trigger: pushing a v* tag.
#
# Needs: NPM_TOKEN secret in the "Zenzip" environment. Provenance needs
# `id-token: write` + npm/pnpm running under GitHub OIDC (automatic on
# GitHub-hosted runners).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # OIDC for npm provenance (SLSA build attestation)

jobs:
  build:
    name: Prebuild (${{ matrix.settings.target }})
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # musl — cross-compiled via cargo-zigbuild so libsqlite3-sys (embedded C)
          # finds a compiler and zig target triples are translated correctly.
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # musl cross-compile toolchain (napi-rs v3 dropped --zig; the flag is now
      # -x / --cross-compile, which drives cargo-zigbuild — wiring BOTH the Rust
      # linker and the C compiler (libsqlite3-sys) to zig. napi's -x needs a real
      # `zig` binary on PATH, so install it (verified locally against musl).
      - name: Set up zig
        if: ${{ matrix.settings.cross }}
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild
        if: ${{ matrix.settings.cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: pnpm install --frozen-lockfile
      - name: Build native module
        run: >-
          pnpm --filter @zenzipjs/core-native exec napi build --platform --release
          --target ${{ matrix.settings.target }}
          ${{ matrix.settings.cross && '-x' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: binding-${{ matrix.settings.target }}
          path: packages/core-native/*.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment: Zenzip
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create platform packages from prebuilds
        # napi v3: `--dir` → `--output-dir`; the npm/<target> package dirs must
        # exist first (create-npm-dirs), then artifacts copies each .node in.
        run: |
          pnpm --filter @zenzipjs/core-native exec napi create-npm-dirs
          pnpm --filter @zenzipjs/core-native exec napi artifacts --output-dir ../../artifacts
      - name: Build TypeScript package
        run: pnpm --filter zenzip build
      # Software Bill of Materials: CycloneDX SBOM attached to the release.
      - name: Generate SBOM (CycloneDX)
        run: npx -y @cyclonedx/cyclonedx-npm --output-file sbom.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: warn
      # `--provenance` publishes a signed SLSA build-provenance attestation to
      # the npm registry (visible on the package page). Requires id-token: write.
      # napi prepublish publishes the per-platform packages + rewrites the main
      # package.json's optionalDependencies. It does NOT publish the main
      # package — that's the next step. --no-gh-release: skip creating a GitHub
      # release object (nothing downstream consumes it, and it was 401'ing
      # regardless of GITHUB_TOKEN wiring).
      - name: Publish @zenzipjs/core-native platform packages
        run: pnpm --filter @zenzipjs/core-native exec napi prepublish -t npm --no-gh-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - name: Publish @zenzipjs/core-native main package
        run: pnpm --filter @zenzipjs/core-native publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish zenzip
        run: pnpm --filter zenzip publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish create-zenzip-app
        run: pnpm --filter create-zenzip-app publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
