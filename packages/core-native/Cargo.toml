[package]
name = "zenzip-napi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["async", "serde-json"] }
napi-derive = "3"
zenzip-core = { path = "../../crates/zenzip-core" }
serde_json = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "macros"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[build-dependencies]
napi-build = "2"
