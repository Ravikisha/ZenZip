apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app: {{ .Release.Name }} }
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: zenzip
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ .Values.ports.http }} }
            - { name: dashboard, containerPort: {{ .Values.ports.dashboard }} }
          env:
            - { name: NODE_ENV, value: production }
            {{- if .Values.postgres.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.postgres.urlSecret }}, key: DATABASE_URL }
            {{- end }}
            {{- if .Values.encryption.secretName }}
            - name: ZENZIP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.encryption.secretName }}, key: encryptionKey }
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          lifecycle:
            preStop: { exec: { command: ["sleep", "10"] } }
          resources: {{ toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - { name: data, mountPath: {{ .Values.persistence.mountPath }} }
          {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.persistence.size }} } }
  {{- end }}
